[project]
name = "lakebase-workshop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
    "yoyo-migrations>=8.2.0",
    "databricks-sdk>=0.20.0",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["yoyo", "yoyo.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
